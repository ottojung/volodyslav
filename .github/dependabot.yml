version: 2

multi-ecosystem-groups:
    javascript:
        schedule:
            interval: "weekly"
            day: "monday"
            time: "06:00"
            timezone: "UTC"

updates:
    - package-ecosystem: "npm"
      directory: "/"
      patterns:
          - "*"
      multi-ecosystem-group: "javascript"

    - package-ecosystem: "bun"
      directory: "/"
      patterns:
          - "*"
      multi-ecosystem-group: "javascript"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "06:00"
          timezone: "UTC"
